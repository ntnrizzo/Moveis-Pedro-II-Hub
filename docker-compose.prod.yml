version: '3.8'

services:
  moveis-pedro-ii-app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        - VITE_SUPABASE_URL=${VITE_SUPABASE_URL}
        - VITE_SUPABASE_ANON_KEY=${VITE_SUPABASE_ANON_KEY}
    container_name: moveis-pedro-ii-app
    restart: always
    ports:
      - "80:3001" # Mapeia a porta 80 (HTTP padrão) da VPS para a 3001 do App
    env_file:
      - .env
      # volumes:
      # - ./robo-whatsapp-agendamentos/.wwebjs_auth:/app/.wwebjs_auth # Persistir sessão do WhatsApp
      # - ./robo-whatsapp-agendamentos/.wwebjs_cache:/app/.wwebjs_cache # Persistir cache do Puppeteer
      # Healthcheck inteligente: verifica se WhatsApp responde de verdade

      # Retorna 503 se offline há mais de 10 min → Docker reinicia o container
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:3001/" ]
      interval: 2m
      timeout: 15s
      retries: 3
      start_period: 60s
